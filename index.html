<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MotionLab — 2D Physics Sandbox</title>
<meta name="description" content="MotionLab: a minimalist, interactive 2D physics sandbox in the browser, powered by Matter.js.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f6db3' stroke-width='1.7'%3E%3Ccircle cx='12' cy='12' r='2.2'/%3E%3Cellipse cx='12' cy='12' rx='10' ry='4.2' transform='rotate(-24 12 12)'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <!-- ===== Top toolbar ===== -->
  <header id="topbar">
    <div class="tb-group brand">
      <span id="logo" class="logo" aria-hidden="true"></span>
      <span class="brand-name">MotionLab</span>
    </div>
    <div class="tb-group project">
      <input id="projectName" class="project-name" type="text" value="Untitled Scene" maxlength="60" aria-label="项目名称" spellcheck="false">
      <button id="btnScenes" class="tb-btn wide" title="场景管理"></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button id="btnUndo" class="tb-btn icon" title="撤销 (Ctrl+Z)"></button>
      <button id="btnRedo" class="tb-btn icon" title="重做 (Ctrl+Shift+Z)"></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group transport">
      <button id="btnPlay" class="tb-btn primary" title="运行"></button>
      <button id="btnPause" class="tb-btn icon" title="暂停"></button>
      <button id="btnStep" class="tb-btn icon" title="单步运行一帧"></button>
      <button id="btnReset" class="tb-btn icon" title="重置场景"></button>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-group">
      <button id="btnSave" class="tb-btn wide" title="保存场景 (Ctrl+S)"></button>
      <button id="btnShot" class="tb-btn icon" title="导出画布截图 PNG"></button>
      <button id="btnExport" class="tb-btn icon" title="导出 JSON"></button>
      <button id="btnImport" class="tb-btn icon" title="导入 JSON"></button>
      <input id="fileImport" type="file" accept="application/json,.json" hidden>
      <button id="btnSettings" class="tb-btn icon" title="设置"></button>
      <button id="btnPanel" class="tb-btn icon" title="折叠 / 展开属性面板"></button>
    </div>
  </header>

  <div id="main">
    <!-- ===== Left tool rail ===== -->
    <nav id="toolrail" aria-label="工具">
      <button class="tool-btn" data-tool="select" title="选择"></button>
      <button class="tool-btn" data-tool="move" title="移动 / 平移画布"></button>
      <div class="rail-sep"></div>
      <button class="tool-btn" data-tool="circle" title="圆形"></button>
      <button class="tool-btn" data-tool="rectangle" title="矩形"></button>
      <button class="tool-btn" data-tool="polygon" title="多边形"></button>
      <button class="tool-btn" data-tool="triangle" title="三角形"></button>
      <button class="tool-btn" data-tool="line" title="静态线段"></button>
      <div class="rail-sep"></div>
      <button class="tool-btn" data-tool="spring" title="弹簧 / 连杆"></button>
      <div class="rail-sep"></div>
      <button class="tool-btn danger" data-tool="delete" title="删除"></button>
    </nav>

    <!-- ===== Canvas ===== -->
    <section id="stage">
      <canvas id="world"></canvas>
      <div id="stageHint" class="stage-hint"></div>
      <div class="zoom-ctl">
        <button id="btnZoomOut" class="z-btn" title="缩小"></button>
        <button id="btnZoomFit" class="z-label" title="适应画布">100%</button>
        <button id="btnZoomIn" class="z-btn" title="放大"></button>
      </div>
    </section>

    <!-- ===== Right property panel ===== -->
    <aside id="panel">
      <div id="panelBody"></div>
    </aside>
  </div>

  <!-- ===== Status bar ===== -->
  <footer id="statusbar">
    <span class="st-item" id="stFps">FPS —</span>
    <span class="st-item" id="stCount">物体 0</span>
    <span class="st-item" id="stState">已暂停</span>
    <span class="st-spacer"></span>
    <span class="st-item" id="stGravity">Gravity (0, 1)</span>
    <span class="st-item" id="stSpeed">Speed 1.0×</span>
    <span class="st-item" id="stZoom">Zoom 100%</span>
  </footer>
</div>

<!-- ===== Scenes modal ===== -->
<div id="modalScenes" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-label="场景管理">
    <div class="modal-head"><span>场景管理</span><button class="tb-btn icon modal-close" data-close="modalScenes"></button></div>
    <div class="modal-actions">
      <button id="btnNewScene" class="btn"></button>
      <button id="btnDuplicateScene" class="btn"></button>
    </div>
    <div class="panel-title"><span class="dot"></span>实验预设 Presets</div>
    <div id="presetList" class="preset-grid"></div>
    <div class="panel-title"><span class="dot"></span>已保存场景</div>
    <div id="sceneList" class="scene-list"></div>
  </div>
</div>

<!-- ===== Settings modal ===== -->
<div id="modalSettings" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-label="设置">
    <div class="modal-head"><span>设置</span><button class="tb-btn icon modal-close" data-close="modalSettings"></button></div>
    <div id="settingsBody"></div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="vendor/matter.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
